[project]
site_name = "Infisical Entity Operator"
site_description = "Kubernetes-native lifecycle management for Infisical control-plane entities."
site_author = "winrarr"
copyright = "Copyright © 2026 winrarr"
site_url = "https://winrarr.github.io/infisical-entity-operator/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/winrarr/infisical-entity-operator"
repo_name = "winrarr/infisical-entity-operator"
edit_uri = "edit/main/docs/"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Using the Operator" = [
    "usage/index.md",
    { "Quickstart" = "usage/quickstart.md" },
    { "Installation" = "usage/installation.md" },
    { "Concepts" = "usage/concepts.md" },
    { "Guides" = [
      { "Lifecycle and Ownership" = "usage/reference/deletion-and-ownership.md" },
      { "Security" = "usage/reference/security.md" },
      { "Troubleshooting" = "usage/reference/troubleshooting.md" },
      { "Examples" = [
        "usage/examples/index.md",
        { "Project and Identity" = "usage/examples/project-and-identity.md" },
      ] },
    ] },
    { "Reference" = [
      "usage/reference/index.md",
      { "Resources" = "usage/reference/resources.md" },
      { "Status and Conditions" = "usage/reference/status-and-conditions.md" },
      { "Custom Resources" = [
        "usage/crds/index.md",
        { "InfisicalConnection" = "usage/crds/infisical-connection.md" },
        { "InfisicalProject" = "usage/crds/infisical-project.md" },
        { "InfisicalEnvironment" = "usage/crds/infisical-environment.md" },
        { "InfisicalProjectRole" = "usage/crds/infisical-project-role.md" },
        { "InfisicalIdentity" = "usage/crds/infisical-identity.md" },
        { "InfisicalKubernetesAuth" = "usage/crds/infisical-kubernetes-auth.md" },
      ] },
      { "Generated API Reference" = "usage/reference/api.md" },
    ] },
  ] },
  { "Developing the Project" = [
    "development/index.md",
    { "Architecture" = [
      "development/architecture/index.md",
      { "Technical Architecture" = "development/architecture.md" },
      { "Decisions" = "development/decisions/index.md" },
    ] },
    { "Contributing" = [
      { "Local Development" = "development/contributing/local-development.md" },
      { "Documentation" = "development/contributing/documentation.md" },
    ] },
    { "Operations" = [
      "development/operations/index.md",
      { "Local Kind" = "development/operations/local-kind.md" },
    ] },
    { "Project" = [
      "development/project/index.md",
      { "Product Scope" = "development/project/product.md" },
      { "Backlog" = "development/project/backlog.md" },
      { "Tech Debt" = "development/project/tech-debt.md" },
      { "Verification" = "development/project/verification.md" },
    ] },
    { "Research" = "development/research/2026-09-09-infisical-api-and-versions.md" },
  ] },
]

[project.theme]
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.tracking",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.action.edit",
  "content.action.view",
]

# Follow the operating system by default, while allowing manual switching.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "indigo"
accent = "cyan"

# Palette toggle for light mode.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "indigo"
accent = "cyan"

# Palette toggle for dark mode.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "indigo"
accent = "cyan"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/winrarr/infisical-entity-operator"

[project.validation]
invalid_links = true
invalid_link_anchors = true

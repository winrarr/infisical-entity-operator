# This rule is not used by the project infisical-entity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to InfisicalProjectRole resources.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infisical-entity-operator
    app.kubernetes.io/managed-by: kustomize
  name: infisical-infisicalprojectrole-viewer-role
rules:
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojectroles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojectroles/status
  verbs:
  - get

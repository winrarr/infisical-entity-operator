# This rule is not used by the project infisical-entity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the infisical.infisical-operator.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infisical-entity-operator
    app.kubernetes.io/managed-by: kustomize
  name: infisical-infisicalproject-editor-role
rules:
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojects
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojects/status
  verbs:
  - get

# This rule is not used by the project infisical-entity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infisical-entity-operator
    app.kubernetes.io/managed-by: kustomize
  name: infisical-infisicalprojecttemplate-editor-role
rules:
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojecttemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalprojecttemplates/status
  verbs:
  - get

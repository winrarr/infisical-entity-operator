# This rule is not used by the project infisical-entity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to infisical.infisical-operator.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infisical-entity-operator
    app.kubernetes.io/managed-by: kustomize
  name: infisical-infisicalconnection-viewer-role
rules:
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infisical.infisical-operator.io
  resources:
  - infisicalconnections/status
  verbs:
  - get

name: E2E Tests

on:
  pull_request:

jobs:
  test-e2e:
    name: Kind default CNI and Infisical
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache project tools
        uses: actions/cache@v5
        with:
          path: bin
          key: ${{ runner.os }}-infisical-e2e-tools-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-infisical-e2e-tools-

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-infisical-e2e-buildx-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-infisical-e2e-buildx-

      - name: Run live test
        env:
          DOCKER_BUILD_CACHE_ARGS: >-
            --cache-from=type=local,src=${{ runner.temp }}/.buildx-cache
            --cache-to=type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
        run: make kind-e2e

      - name: Delete the Kind cluster
        if: always()
        run: make kind-down || true

      - name: Save Docker layers
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/.buildx-cache-new" ]; then
            rm -rf "$RUNNER_TEMP/.buildx-cache"
            mv "$RUNNER_TEMP/.buildx-cache-new" "$RUNNER_TEMP/.buildx-cache"
          fi

                    description: Name is the referenced resource name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              projectRoleBindings:
                description: |-
                  ProjectRoleBindings grants an organization-scoped identity roles in selected projects.
                  A binding manages that project's complete permanent role list; omitted projects are left
                  unmanaged. Every referenced project must belong to the organization from organizationRef.
                items:
                  description: IdentityProjectRoleBinding declares the permanent project
                    roles for an organization-scoped identity.
                  properties:
                    projectRef:
                      description: ProjectRef references the project receiving this
                        identity's roles.
                      properties:
                        name:

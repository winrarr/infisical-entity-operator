                - type
                x-kubernetes-list-type: map
              identityID:
                description: IdentityID is the immutable Infisical identifier once
                  created or adopted.
                type: string
              membershipID:
                description: MembershipID is the Infisical project membership identifier
                  when role management is enabled.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation reflected
                  in status.
                format: int64
                type: integer
              organizationID:
                description: OrganizationID is the observed owning organization identifier
                  for an organization-scoped identity.
                type: string
              organizationRole:
                description: OrganizationRole is the observed organization role for
                  an organization-scoped identity.
                type: string
              projectID:
                description: ProjectID is the observed owning project identifier.
                type: string
              projectMemberships:
                description: ProjectMemberships contains observed memberships managed
                  through projectRoleBindings.
                items:
                  description: IdentityProjectMembershipStatus describes an observed
                    project membership for an organization-scoped identity.
                  properties:
                    membershipID:
                      description: MembershipID is the Infisical project membership
                        identifier.
                      type: string
                    projectID:
                      description: ProjectID is the Infisical project identifier.
                      type: string
                    roles:
                      description: Roles contains the observed permanent or temporary
                        roles.
                      items:
                        description: IdentityRoleStatus describes an observed permanent
                          or temporary project role.
                        properties:
                          isTemporary:
                            description: IsTemporary reports whether Infisical marked
                              the assignment as temporary.
                            type: boolean
                          name:
                            description: Name is the custom role display name when
                              available.
                            type: string
                          roleID:
                            description: RoleID is the Infisical role assignment identifier.
                            type: string
                          slug:
                            description: Slug is the built-in or custom role slug.
                            type: string
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              roles:

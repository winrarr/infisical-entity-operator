            properties:
              connectionRef:
                description: ConnectionRef selects the Infisical API connection.
                properties:
                  name:
                    description: Name is the InfisicalConnection name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: CreationPolicy controls whether the operator creates
                  or adopts an identity.
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: DeletionPolicy controls whether the external identity
                  is deleted with this resource.
                enum:
                - Delete
                - Orphan
                type: string
              hasDeleteProtection:

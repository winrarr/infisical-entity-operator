            x-kubernetes-validations:
            - message: connectionRef is immutable; delete and recreate the InfisicalIdentity
              rule: '!has(oldSelf.connectionRef) || self.connectionRef == oldSelf.connectionRef'
            - message: scope is immutable; delete and recreate the InfisicalIdentity
              rule: '!has(oldSelf.scope) || self.scope == oldSelf.scope'
            - message: projectRef is immutable; delete and recreate the InfisicalIdentity
              rule: '!has(oldSelf.projectRef) || self.projectRef == oldSelf.projectRef'
            - message: organizationRef is immutable; delete and recreate the InfisicalIdentity
              rule: '!has(oldSelf.organizationRef) || self.organizationRef == oldSelf.organizationRef'
            - message: Project scope requires projectRef and Organization scope requires
                organizationRef
              rule: 'self.scope == ''Organization'' ? has(self.organizationRef) &&
                (!has(self.projectRef) || size(self.projectRef.name) == 0) : has(self.projectRef)
                && size(self.projectRef.name) > 0 && !has(self.organizationRef)'
            - message: roleSlugs is only valid for Project scope and projectRoleBindings
                is only valid for Organization scope
              rule: 'self.scope == ''Organization'' ? (!has(self.roleSlugs) || size(self.roleSlugs)
                == 0) : (!has(self.projectRoleBindings) || size(self.projectRoleBindings)
                == 0)'
            - message: organizationRole is only valid for Organization scope
              rule: self.scope == 'Organization' || !has(self.organizationRole)

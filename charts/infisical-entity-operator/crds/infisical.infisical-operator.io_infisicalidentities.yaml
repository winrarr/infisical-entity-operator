                properties:
                  name:
                    description: Name is the referenced resource name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              organizationRole:
                description: |-
                  OrganizationRole is the Infisical organization role for an organization-scoped identity.
                  Leave it empty to use Infisical's least-privilege no-access role. Project-scoped identities
                  must omit this field.
                minLength: 1
                type: string
              projectRef:
                description: ProjectRef references the InfisicalProject resource that
